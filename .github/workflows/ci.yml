name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint (enforces context boundaries)
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit & e2e tests
        run: npm test
      - name: Dependency audit (high+ in prod deps)
        run: npm run audit:ci
