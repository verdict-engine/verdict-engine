# Full self-hosted stack: Postgres + Redis + engine + operator dashboard.
# Config is env-driven — copy .env.example to .env and adjust. Most values have safe fallbacks,
# but AUTH_SECRET has NONE by design: the stack refuses to start until you supply a real one.
#   AUTH_SECRET=$(openssl rand -hex 32) docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-verdict}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-verdict}
      - POSTGRES_DB=${POSTGRES_DB:-verdict}
    volumes:
      - verdict-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdict}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - verdict-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: .
    image: verdict-engine:0.7.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ENGINE_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-verdict}:${POSTGRES_PASSWORD:-verdict}@db:5432/${POSTGRES_DB:-verdict}
      # Redis shares idempotency, velocity and rate limits across replicas (bundled service).
      - REDIS_URL=redis://redis:6379
      # No fallback on purpose — an unset or empty AUTH_SECRET stops compose with this message.
      # Quoted because the message contains a colon (YAML would otherwise read it as a map).
      - "AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET to a real secret — generate one with openssl rand -hex 32}"
      - SCORER=${SCORER:-weighted}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
      - RATE_LIMIT_DECISIONS_PER_MIN=${RATE_LIMIT_DECISIONS_PER_MIN:-600}
      - RATE_LIMIT_LOGIN_PER_MIN=${RATE_LIMIT_LOGIN_PER_MIN:-10}
      # This stack terminates at one proxy/LB in front of the engine; trust exactly one hop.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Previous signing secret(s) kept valid during an AUTH_SECRET rotation (comma-separated).
      - AUTH_SECRET_PREVIOUS=${AUTH_SECRET_PREVIOUS:-}
      # Data retention — the prune job ages out the append-only collections (days; 0 = forever).
      - RETENTION_SWEEP_MINUTES=${RETENTION_SWEEP_MINUTES:-60}
      - RETENTION_VERDICTS_DAYS=${RETENTION_VERDICTS_DAYS:-365}
      - RETENTION_ACTIVITY_DAYS=${RETENTION_ACTIVITY_DAYS:-90}
      - RETENTION_REPLAY_DAYS=${RETENTION_REPLAY_DAYS:-90}
      - RETENTION_IDEMPOTENCY_DAYS=${RETENTION_IDEMPOTENCY_DAYS:-7}
      - RETENTION_DEAD_LETTER_DAYS=${RETENTION_DEAD_LETTER_DAYS:-30}
      # Default per-channel alert throttle (alerts/minute; 0 = unlimited).
      - NOTIFY_THROTTLE_PER_MIN=${NOTIFY_THROTTLE_PER_MIN:-60}
      # ML model source (SCORER=ml). Unset = bundled weights; load from a file, https URL, or S3.
      - MODEL_SOURCE=${MODEL_SOURCE:-}
      - MODEL_PATH=${MODEL_PATH:-}
      - MODEL_URL=${MODEL_URL:-}
      - MODEL_S3_ENDPOINT=${MODEL_S3_ENDPOINT:-}
      - MODEL_S3_REGION=${MODEL_S3_REGION:-}
      - MODEL_S3_BUCKET=${MODEL_S3_BUCKET:-}
      - MODEL_S3_KEY=${MODEL_S3_KEY:-}
      - MODEL_S3_ACCESS_KEY_ID=${MODEL_S3_ACCESS_KEY_ID:-}
      - MODEL_S3_SECRET_ACCESS_KEY=${MODEL_S3_SECRET_ACCESS_KEY:-}
      - MODEL_REFRESH_MINUTES=${MODEL_REFRESH_MINUTES:-0}
      # Reclaim disk after a prune sweep that deleted rows (Postgres VACUUM).
      - RETENTION_VACUUM=${RETENTION_VACUUM:-false}
      # Protect /metrics with a bearer token (unset = public; keep the port private either way).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Distributed tracing: set an OTLP/HTTP endpoint (e.g. an OpenTelemetry Collector) to enable it.
      # Unset = tracing off (no overhead). TRACE_SAMPLE_RATIO in [0,1] head-samples root traces.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-verdict-engine}
      - TRACE_SAMPLE_RATIO=${TRACE_SAMPLE_RATIO:-1}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Filesystem paths whose disk health to report at GET /v1/config/storage (comma-separated).
      # The engine only sees filesystems mounted into its OWN container. To watch the Postgres
      # volume from here, uncomment the read-only mount below and set this to /monitor/db.
      - DISK_HEALTH_PATHS=${DISK_HEALTH_PATHS:-}
    # volumes:
    #   # Read-only view of the database volume so the engine can report its disk health.
    #   - verdict-db:/monitor/db:ro

  dashboard:
    build: ../verdict-dashboard
    image: verdict-dashboard:0.7.0
    depends_on:
      - engine
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - VERDICT_API_URL=http://engine:4000

volumes:
  verdict-db:
  verdict-redis:
